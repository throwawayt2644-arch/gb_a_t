workflows:
  android-build:
    name: Android Glanceable Weather Build
    max_build_duration: 30
    instance_type: mac_mini_m1
    environment:
      java: 17
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: '*'
          include: true
          source: true

    scripts:
      - name: Set Android SDK location
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      - name: Make gradlew executable
        script: chmod +x ./gradlew

      - name: Run Unit Tests
        script: |
          ./gradlew test --no-daemon

      - name: Build APKs
        script: |
          ./gradlew assembleDebug assembleRelease --no-daemon

      - name: Print Version Info
        script: |
          VERSION_NAME=$(grep -E 'versionName\s*=' app/build.gradle.kts | awk -F '"' '{print $2}')
          VERSION_CODE=$(grep -E 'versionCode\s*=' app/build.gradle.kts | awk -F '=' '{print $2}' | tr -d ' ')
          echo "Build Version Name: $VERSION_NAME"
          echo "Build Version Code: $VERSION_CODE"

    artifacts:
      - app/build/outputs/**/*.apk
      - app/build/outputs/**/mapping.txt
